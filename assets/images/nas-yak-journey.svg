<svg viewBox="0 0 640 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>오늘의 NAS 삽질 타임라인</title>
<desc>비밀번호 분실부터 초기화, DDNS, 포트포워딩, 웹/FTP 접속 시도까지 여섯 단계를 거치며 대부분 막히고 마지막에 VPN이 필요하다는 결론에 이른 과정을 보여주는 세로 타임라인</desc>
<style>
  .step-title { font: 600 14px -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .step-sub { font: 11px -apple-system, "Segoe UI", sans-serif; fill: #666666; }
  .badge { font: 700 10px -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
  .legend { font: 11px -apple-system, "Segoe UI", sans-serif; fill: #666666; }
  .conn { stroke: #d8d8d8; stroke-width: 2; }
</style>

<line x1="36" y1="54" x2="36" y2="434" class="conn"/>

<!-- Step 1 -->
<circle cx="36" cy="54" r="8" fill="#e2564f"/>
<text x="36" y="58" text-anchor="middle" class="badge">✕</text>
<rect x="58" y="32" width="546" height="44" rx="9" fill="#f5f5f5"/>
<text x="76" y="50" class="step-title">1. 로그인 시도</text>
<text x="76" y="66" class="step-sub">비밀번호 분실 · 기본값 다 안 먹힘</text>

<!-- Step 2 -->
<circle cx="36" cy="126" r="8" fill="#e2564f"/>
<text x="36" y="130" text-anchor="middle" class="badge">✕</text>
<rect x="58" y="104" width="546" height="44" rx="9" fill="#f5f5f5"/>
<text x="76" y="122" class="step-title">2. 리셋 버튼 삽질</text>
<text x="76" y="138" class="step-sub">4초 리셋, 잘못된 40초 절차 → 계속 그대로</text>

<!-- Step 3 -->
<circle cx="36" cy="198" r="8" fill="#e2564f"/>
<text x="36" y="202" text-anchor="middle" class="badge">✕</text>
<rect x="58" y="176" width="546" height="44" rx="9" fill="#f5f5f5"/>
<text x="76" y="194" class="step-title">3. 알려진 보안 취약점 우회 시도</text>
<text x="76" y="210" class="step-sub">이미 막혀있음 (406 Not Acceptable)</text>

<!-- Step 4 -->
<circle cx="36" cy="270" r="8" fill="#3fa876"/>
<text x="36" y="274" text-anchor="middle" class="badge">✓</text>
<rect x="58" y="248" width="546" height="44" rx="9" fill="#f5f5f5"/>
<text x="76" y="266" class="step-title">4. 전원 재연결 + 60초 리셋</text>
<text x="76" y="282" class="step-sub">드디어 초기화 성공, 새 관리자 계정 생성</text>

<!-- Step 5 -->
<circle cx="36" cy="342" r="8" fill="#3fa876"/>
<text x="36" y="346" text-anchor="middle" class="badge">✓</text>
<rect x="58" y="320" width="546" height="44" rx="9" fill="#f5f5f5"/>
<text x="76" y="338" class="step-title">5. DDNS + 도메인 연결</text>
<text x="76" y="354" class="step-sub">no-ip · 가비아 CNAME까지 정상 연결</text>

<!-- Step 6 -->
<circle cx="36" cy="414" r="8" fill="#e2564f"/>
<text x="36" y="418" text-anchor="middle" class="badge">✕</text>
<rect x="58" y="392" width="546" height="44" rx="9" fill="#f5f5f5"/>
<text x="76" y="410" class="step-title">6. 웹 · WebDAV · FTP 접속</text>
<text x="76" y="426" class="step-sub">Forbidden 벽 + FTP 데이터 채널 실패</text>

<!-- Conclusion -->
<rect x="58" y="452" width="546" height="38" rx="9" fill="#eef3ff" stroke="#7b93d6" stroke-width="1.5"/>
<text x="331" y="476" text-anchor="middle" class="step-title" fill="#3a4f8f">→ 결론: VPN(Tailscale) 없이는 답이 없다</text>

<text x="36" y="16" class="legend">● 초록 = 성공 · ● 빨강 = 막힘</text>
</svg>
