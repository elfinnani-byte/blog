<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" style="border-radius: 14px; background: rgb(248, 250, 252);" role="img">
<title>OCR 조립 라인: 전처리, 검출, 인식, 레이아웃 분석</title>
<desc>출처: 모두의연구소 AIFFEL "AI의 이해와 사용" 강의자료, 2장 "글자를 꺼내는 길, OCR 조립 라인"</desc>
<defs>
<marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"></path>
</marker>
</defs>
<rect x="1" y="1" width="878" height="398" rx="14" fill="#f8fafc" stroke="#cbd5e1"></rect>
<text x="34" y="40" fill="#0f172a" font-family="sans-serif" font-size="20" font-weight="700">전통 OCR의 조립 라인</text>
<text x="34" y="64" fill="#64748b" font-family="sans-serif" font-size="13">정거장마다 다루는 대상이 바뀝니다. 픽셀에서 시작해 구조로 끝납니다.</text>
<g transform="translate(30,92)">
<rect width="190" height="118" rx="12" fill="#1d4ed8"></rect>
<text x="95" y="30" text-anchor="middle" fill="#bfdbfe" font-family="sans-serif" font-size="11" font-weight="700">STEP 1</text>
<text x="95" y="56" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="700">전처리</text>
<text x="95" y="80" text-anchor="middle" fill="#dbeafe" font-family="sans-serif" font-size="12">기울기 보정</text>
<text x="95" y="98" text-anchor="middle" fill="#dbeafe" font-family="sans-serif" font-size="12">잡음 제거 · 이진화</text>
</g>
<g transform="translate(250,92)">
<rect width="190" height="118" rx="12" fill="#6d28d9"></rect>
<text x="95" y="30" text-anchor="middle" fill="#ddd6fe" font-family="sans-serif" font-size="11" font-weight="700">STEP 2</text>
<text x="95" y="56" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="700">검출</text>
<text x="95" y="80" text-anchor="middle" fill="#ede9fe" font-family="sans-serif" font-size="12">글자가 어디 있나</text>
<text x="95" y="98" text-anchor="middle" fill="#ede9fe" font-family="sans-serif" font-size="12">줄 · 단어 상자 찾기</text>
</g>
<g transform="translate(470,92)">
<rect width="190" height="118" rx="12" fill="#0e7490"></rect>
<text x="95" y="30" text-anchor="middle" fill="#cffafe" font-family="sans-serif" font-size="11" font-weight="700">STEP 3</text>
<text x="95" y="56" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="700">인식</text>
<text x="95" y="80" text-anchor="middle" fill="#cffafe" font-family="sans-serif" font-size="12">그 조각이 무슨 글자인가</text>
<text x="95" y="98" text-anchor="middle" fill="#cffafe" font-family="sans-serif" font-size="12">상자 → 문자열</text>
</g>
<g transform="translate(690,92)">
<rect width="160" height="118" rx="12" fill="#b45309"></rect>
<text x="80" y="30" text-anchor="middle" fill="#fed7aa" font-family="sans-serif" font-size="11" font-weight="700">STEP 4</text>
<text x="80" y="56" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="700">레이아웃 분석</text>
<text x="80" y="80" text-anchor="middle" fill="#fed7aa" font-family="sans-serif" font-size="12">제목 · 표 · 항목-값</text>
<text x="80" y="98" text-anchor="middle" fill="#fed7aa" font-family="sans-serif" font-size="12">문자열 → 구조</text>
</g>
<path d="M 224 151 H 244" stroke="#475569" stroke-width="3" marker-end="url(#ar1)"></path>
<path d="M 444 151 H 464" stroke="#475569" stroke-width="3" marker-end="url(#ar1)"></path>
<path d="M 664 151 H 684" stroke="#475569" stroke-width="3" marker-end="url(#ar1)"></path>
<text x="34" y="252" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="700">각 정거장이 넘기는 것</text>
<g transform="translate(30,266)">
<rect width="190" height="46" rx="9" fill="#e2e8f0" stroke="#94a3b8"></rect>
<text x="95" y="29" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">깨끗해진 흑백 픽셀</text>
</g>
<g transform="translate(250,266)">
<rect width="190" height="46" rx="9" fill="#e2e8f0" stroke="#94a3b8"></rect>
<text x="95" y="29" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">좌표가 붙은 상자 목록</text>
</g>
<g transform="translate(470,266)">
<rect width="190" height="46" rx="9" fill="#e2e8f0" stroke="#94a3b8"></rect>
<text x="95" y="29" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">상자별 문자열 + 신뢰도</text>
</g>
<g transform="translate(690,266)">
<rect width="160" height="46" rx="9" fill="#e2e8f0" stroke="#94a3b8"></rect>
<text x="80" y="29" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">표 · 문단 · 필드</text>
</g>
<rect x="30" y="336" width="820" height="42" rx="9" fill="#fee2e2" stroke="#fca5a5"></rect>
<text x="440" y="363" text-anchor="middle" fill="#b91c1c" font-family="sans-serif" font-size="14" font-weight="600">화살표는 한 방향입니다. 뒤 정거장은 앞 정거장의 판단을 되돌릴 수 없습니다.</text>
</svg>
