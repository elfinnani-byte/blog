<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
<title>OCR의 박스 vs 객체 탐지의 박스 비교</title>
<desc>OCR에서 박스는 값을 읽기 위한 중간 재료이고, 객체 탐지에서 박스는 최종 답 그 자체라는 차이를 보여주는 다이어그램</desc>
<rect x="0" y="0" width="640" height="260" fill="#f7f9fc" rx="8"></rect>

<text x="160" y="30" font-size="15" font-weight="bold" fill="#555" text-anchor="middle">OCR의 박스</text>
<rect x="40" y="50" width="240" height="140" fill="#ffffff" stroke="#adb5bd" rx="6"></rect>
<text x="60" y="75" font-size="12" fill="#868e96">계약 금액</text>
<rect x="140" y="60" width="120" height="24" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="4 3"></rect>
<text x="200" y="76" font-size="12" fill="#1f6feb" text-anchor="middle">32,000,000</text>
<path d="M 200 90 L 200 130" stroke="#868e96" stroke-width="2" marker-end="url(#arrow1)"></path>
<rect x="120" y="135" width="160" height="36" fill="#e9ecef" stroke="#adb5bd" rx="6"></rect>
<text x="200" y="158" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">값: 32,000,000</text>
<text x="160" y="205" font-size="12" fill="#868e96" text-anchor="middle">박스 = 값을 읽기 위한</text>
<text x="160" y="222" font-size="12" fill="#868e96" text-anchor="middle">중간 재료</text>

<text x="480" y="30" font-size="15" font-weight="bold" fill="#d1495b" text-anchor="middle">객체 탐지의 박스</text>
<rect x="360" y="50" width="240" height="140" fill="#ffffff" stroke="#adb5bd" rx="6"></rect>
<rect x="400" y="70" width="70" height="90" fill="#f1f3f5" stroke="#ced4da"></rect>
<rect x="470" y="90" width="60" height="70" fill="none" stroke="#d1495b" stroke-width="2.5"></rect>
<text x="500" y="85" font-size="11" fill="#d1495b" text-anchor="middle" font-weight="bold">person 0.87</text>
<text x="480" y="205" font-size="12" fill="#d1495b" text-anchor="middle" font-weight="bold">박스 = 최종 답</text>
<text x="480" y="222" font-size="12" fill="#868e96" text-anchor="middle">그 자체</text>

<defs>
<marker id="arrow1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#868e96"></path>
</marker>
</defs>
</svg>
