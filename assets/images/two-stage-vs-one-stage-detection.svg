<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
<title>2단계 방식(R-CNN 계열)과 1단계 방식(YOLO) 비교</title>
<desc>R-CNN 계열은 후보 제안과 분류를 나눠서 두 번에 걸쳐 처리하고, YOLO는 한 번의 순전파로 박스와 클래스를 동시에 예측한다는 차이를 보여주는 다이어그램</desc>
<rect x="0" y="0" width="640" height="260" fill="#f7f9fc" rx="8"></rect>

<text x="160" y="30" font-size="15" font-weight="bold" fill="#555" text-anchor="middle">R-CNN 계열 — 2단계 방식</text>
<rect x="40" y="60" width="240" height="130" fill="#ffffff" stroke="#adb5bd" rx="6"></rect>
<rect x="60" y="80" width="90" height="40" fill="#e9ecef" stroke="#adb5bd" rx="6"></rect>
<text x="105" y="104" font-size="12" fill="#333" text-anchor="middle">후보 제안</text>
<path d="M 155 100 L 195 100" stroke="#868e96" stroke-width="2" marker-end="url(#arrow2)"></path>
<rect x="200" y="80" width="70" height="40" fill="#e9ecef" stroke="#adb5bd" rx="6"></rect>
<text x="235" y="104" font-size="12" fill="#333" text-anchor="middle">분류</text>
<text x="160" y="150" font-size="12" fill="#868e96" text-anchor="middle">두 단계를 순서대로</text>
<text x="160" y="167" font-size="12" fill="#868e96" text-anchor="middle">거쳐야 답이 나옴</text>

<text x="480" y="30" font-size="15" font-weight="bold" fill="#d1495b" text-anchor="middle">YOLO — 1단계 방식</text>
<rect x="360" y="60" width="240" height="130" fill="#ffffff" stroke="#adb5bd" rx="6"></rect>
<rect x="390" y="90" width="180" height="50" fill="#ffe3e3" stroke="#d1495b" stroke-width="2" rx="8"></rect>
<text x="480" y="120" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">박스 + 클래스 동시 예측</text>
<text x="480" y="163" font-size="12" fill="#d1495b" text-anchor="middle" font-weight="bold">한 번의 순전파로 끝</text>

<defs>
<marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#868e96"></path>
</marker>
</defs>
</svg>
